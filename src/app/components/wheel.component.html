<svg [attr.viewBox]="viewBox" [attr.aria-label]="
    activeSlice === null
      ? 'WinDial action wheel with ' + sliceCount + ' slices'
      : 'Slice ' + (activeSlice + 1) + ' selected'
  " role="img" (pointermove)="onPointerMove($event)" (pointerleave)="onPointerLeave()">
  @for (sector of sectors; track sector.index) {
  <g>
    <path class="sector-shape" [class.active]="activeSlice === sector.index" [attr.d]="sector.path" />
    <text class="sector-label" [attr.x]="sector.labelX" [attr.y]="sector.labelY">
      {{ sector.index + 1 }}
    </text>
  </g>
  }

  <circle class="hub" cx="300" cy="300" r="96" />
  <text class="hub-title" x="300" y="294">WINDIAL</text>
  <text class="hub-subtitle" x="300" y="321">{{ hubLabel }}</text>
</svg>
