@if (config; as wheelConfig) {
<app-wheel
  [items]="wheelConfig.root.slices"
  (activeSliceChange)="activeSlice = $event"
  (sliceRelease)="onSliceRelease($event)"
/>
}

@if (browserPreview) {
<div class="preview-badge">BROWSER PREVIEW <span>·</span> Click Settings to edit</div>
}

@if (errorMessage) {
<p class="error-message" role="alert">{{ errorMessage }}</p>
}

@if (config; as wheelConfig) {
<app-settings-dialog [config]="wheelConfig" [open]="settingsOpen" (save)="saveConfig($event)"
  (close)="closeSettings()" />
}
